       <p class="largeText">Which sentence uses personification?</p>
<button class="questionButton" onclick="ans(); this.classList.toggle('selected')">A) The vacuum cleaner ate my socks.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">B) The socks are striped.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">C) I folded the socks.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">D) Socks keep your feet warm.</button>

<p class="largeText">Which one is a simile?</p>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">A) The clouds danced.</button>
<button class="questionButton" onclick="ans(); this.classList.toggle('selected')">B) As brave as a lion.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">C) The wind whispered.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">D) Time is a thief.</button>

<p class="largeText">Which sentence uses hyperbole?</p>
<button class="questionButton" onclick="ans(); this.classList.toggle('selected')">A) I have a million things to do.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">B) The cat slept.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">C) The door creaked.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">D) The sun is bright.</button>

<p class="largeText">Which is a metaphor?</p>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">A) As fast as lightning.</button>
<button class="questionButton" onclick="ans(); this.classList.toggle('selected')">B) The world is a stage.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">C) The leaves danced.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">D) The dog barked.</button>

<p class="largeText">Which answer has BOTH personification and alliteration?</p>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">A) The river ran rapidly.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">B) The dinner danced.</button>
<button class="questionButton" onclick="ans(); this.classList.toggle('selected')">C) The delicious dinner danced.</button>
<button class="questionButton" onclick="wrongAns(); this.classList.toggle('selected')">D) The dog dug deep.</button>
